# The app itself: shared by the HTTP and HTTPS servers.
root /usr/share/nginx/html;
client_max_body_size 25m;
access_log /var/log/nginx/access.log json;

include /etc/nginx/snippets/headers.conf;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;
gzip_min_length 1024;

# Over the limit: answer like the API does, so the app shows a readable message.
error_page 429 = @too_many;
location @too_many {
  include /etc/nginx/snippets/headers.conf;
  default_type application/json;
  return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Wait a minute and try again."}}';
}

# Let's Encrypt HTTP check (certbot --webroot -w deploy/acme), see docs/DEPLOY.md.
location /.well-known/acme-challenge/ {
  root /var/www/acme;
}

location = /nginx-health {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

# Signing in, password resets and shared download links: a few tries a minute per address.
location ~ ^/api/v1/(auth/(login|google|password/(forgot|reset))|exports/download/) {
  limit_req zone=auth burst=20 nodelay;
  include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
  limit_req zone=api burst=100 nodelay;
  include /etc/nginx/snippets/proxy.conf;
}

location /assets/ {
  include /etc/nginx/snippets/headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

location = /index.html {
  include /etc/nginx/snippets/headers.conf;
  add_header Cache-Control "no-cache";
}

location / {
  try_files $uri /index.html;
}
