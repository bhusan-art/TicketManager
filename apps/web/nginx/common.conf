server_tokens off;

# Rate limits per client address. Signing in is limited hard; the rest of the API loosely.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_log_level warn;
limit_req_status 429;

# One JSON line per request, so logs are easy to search. Used by each server block.
log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,'
  '"agent":"$http_user_agent","request_id":"$sent_http_x_request_id"}';
