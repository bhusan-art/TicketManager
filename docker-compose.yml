# TicketManager: the whole stack on one machine.
#   cp .env.example .env    (then change the secrets)
#   docker compose up -d --build
# App: http://localhost:${WEB_PORT} (9080 in .env.example)   Mail catcher: http://localhost:8025

name: ticketmanager

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    <<: *restart
    environment:
      POSTGRES_DB: ticketmanager
      POSTGRES_USER: ticketmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketmanager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketmanager -d ticketmanager']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  redis:
    image: redis:7.4-alpine
    <<: *restart
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '127.0.0.1:6379:6379'

  # Catches every email in development. In production, point SMTP_* at a real mailbox instead.
  mailpit:
    image: axllent/mailpit:v1.27
    <<: *restart
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    <<: *restart
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DATABASE_URL: postgres://ticketmanager:${POSTGRES_PASSWORD:-ticketmanager}@postgres:5432/ticketmanager
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    <<: *restart
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-TicketManager <no-reply@ticketmanager.local>}
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    <<: *restart
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
