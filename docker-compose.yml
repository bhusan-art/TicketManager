# TicketManager: the whole stack on one machine.
#   cp .env.example .env    (then change the secrets)
#   docker compose up -d --build
# App: http://localhost:${WEB_PORT} (9080 in .env.example)   Mail catcher: http://localhost:8025
# On a server: see docs/DEPLOY.md (HTTPS, backups, restore, updates).

name: ticketmanager

x-restart: &restart
  restart: unless-stopped
  # Keep container logs from filling the disk: 5 files of 10 MB per service.
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  postgres:
    image: postgres:17-alpine
    <<: *restart
    environment:
      POSTGRES_DB: ticketmanager
      POSTGRES_USER: ticketmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketmanager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketmanager -d ticketmanager']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:5433:5432'

  redis:
    image: redis:7.4-alpine
    <<: *restart
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '127.0.0.1:6379:6379'

  # Catches every email in development. In production, point SMTP_* at a real mailbox instead.
  mailpit:
    image: axllent/mailpit:v1.27
    <<: *restart
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    <<: *restart
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DATABASE_URL: postgres://ticketmanager:${POSTGRES_PASSWORD:-ticketmanager}@postgres:5432/ticketmanager
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    <<: *restart
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DATABASE_URL: postgres://ticketmanager:${POSTGRES_PASSWORD:-ticketmanager}@postgres:5432/ticketmanager
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-TicketManager <no-reply@ticketmanager.local>}
    depends_on:
      # The API applies database migrations, so the worker starts after it.
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    <<: *restart
    environment:
      # HTTPS turns on by itself when deploy/certs has fullchain.pem and privkey.pem;
      # plain HTTP is then redirected here.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    ports:
      - '${WEB_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/acme:/var/www/acme:ro
    depends_on:
      api:
        condition: service_healthy

  # Nightly database backup into ./backups (or BACKUP_DIR). Files live in the database, so this
  # one dump is the whole app. Restore with deploy/restore.sh.
  backup:
    image: postgres:17-alpine
    <<: *restart
    # Copies the scripts in without Windows line endings (a CRLF checkout breaks them), then starts.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /scripts &&
        sed 's/\r$$//' /scripts-src/backup.sh > /scripts/backup.sh &&
        sed 's/\r$$//' /scripts-src/healthcheck.sh > /scripts/healthcheck.sh &&
        exec /bin/sh /scripts/backup.sh
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      PGHOST: postgres
      PGUSER: ticketmanager
      PGDATABASE: ticketmanager
      PGPASSWORD: ${POSTGRES_PASSWORD:-ticketmanager}
    volumes:
      - ./deploy/backup:/scripts-src:ro
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ['CMD', '/bin/sh', '/scripts/healthcheck.sh']
      interval: 30s
      timeout: 10s
      start_period: 2m
    depends_on:
      # The API creates the tables, including backup_runs.
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
