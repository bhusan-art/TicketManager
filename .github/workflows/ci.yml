name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ticketmanager
          POSTGRES_PASSWORD: ticketmanager
          POSTGRES_DB: ticketmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://ticketmanager:ticketmanager@localhost:5432/ticketmanager_test
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Migrations match the schema
        run: npm run db:check -w apps/api

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Check the app, API and first-admin sign-in through nginx
        run: |
          curl -fsS http://localhost:9080/ | grep -q '<title>TicketManager</title>'
          curl -fsS http://localhost:9080/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -X POST http://localhost:9080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ChangeMe#2026"}' | grep -q '"accessToken"'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
